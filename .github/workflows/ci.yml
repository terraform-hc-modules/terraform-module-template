name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  opentofu:
    name: OpenTofu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false

      - name: Format Check
        run: tofu fmt -check -recursive

      - name: Init
        run: tofu init -backend=false

      - name: Validate
        run: tofu validate

      - name: Init Wrappers
        run: tofu -chdir=wrappers init -backend=false

      - name: Validate Wrappers
        run: tofu -chdir=wrappers validate

  terragrunt:
    name: Terragrunt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: latest

      - name: Validate Example
        working-directory: _example/terragrunt/basic
        run: terragrunt validate

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Gitleaks
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: gitleaks/gitleaks

      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose --redact

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: Init TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint -f compact --recursive

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup terraform-docs
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: terraform-docs/terraform-docs

      - name: Check every README with terraform-docs markers
        run: |
          set -euo pipefail
          config=""
          if [ -f .terraform-docs.yml ]; then
            config="$PWD/.terraform-docs.yml"
          fi
          status=0
          while IFS= read -r readme; do
            dir="$(dirname "$readme")"
            if [ -n "$config" ]; then
              terraform-docs -c "$config" "$dir" >/dev/null
            else
              terraform-docs markdown table --output-file README.md --output-mode inject "$dir" >/dev/null
            fi
          done < <(grep -rl BEGIN_TF_DOCS --include=README.md . | grep -v '/\.terraform/')
          if ! git diff --exit-code; then
            echo "::error::terraform-docs output is out of date; run terraform-docs and commit the result"
            status=1
          fi
          exit $status
